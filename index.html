<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Генератор паролей</h1>
        <input type="text" id="password" readonly>
        <button onclick="copyPassword()">Копировать</button>

        <label>Длина пароля: <span id="lengthValue">12</span></label>
        <input type="range" id="length" min="6" max="20" value="12">

        <label><input type="checkbox" id="uppercase" checked> Заглавные буквы</label>
        <label><input type="checkbox" id="lowercase" checked> Строчные буквы</label>
        <label><input type="checkbox" id="numbers" checked> Цифры</label>
        <label><input type="checkbox" id="symbols"> Символы</label>

        <button onclick="generate()">Сгенерировать</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
